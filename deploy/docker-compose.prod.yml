# Production stack for a single VPS with Caddy on the shared `proxy` network.
# Run from the repo root:  docker compose -f deploy/docker-compose.prod.yml up -d --build
name: core-api

services:
  db:
    image: postgres:16-alpine
    container_name: core-api-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: core_api
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core_api"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: core-api:local
    container_name: core-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://core:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/core_api
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Cloudflare TURN (optional) — needed for /v1/turn/credentials in prod.
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID:-}
      CF_TURN_API_TOKEN: ${CF_TURN_API_TOKEN:-}
      # AI gateway (optional) — Angano's story narrator. Unset = feature off.
      AI_BASE_URL: ${AI_BASE_URL:-https://ai.njakasoa.xyz}
      AI_API_TOKEN: ${AI_API_TOKEN:-}
      # Angano: name a legend and it is told verbatim, with no AI call — which is what
      # lets the browser play its recorded narration pack (a pack belongs to one preset,
      # and an AI-written story has no id). Unset = the AI writes.
      #
      # This list is exhaustive: a variable that is only in `.env` never reaches the
      # container. Adding one here is part of shipping it. Empty defaults are only safe
      # for values the code reads raw — `env.ts` validates the rest, and an empty string
      # is not "unset" to zod: it fails, and the API refuses to boot.
      ANGANO_STORY_PRESET: ${ANGANO_STORY_PRESET:-}
      # How many proxies append to x-forwarded-for in front of the container. The
      # rate limiter reads that many hops from the RIGHT, because only the last
      # entry is one the caller cannot forge. 1 = the Caddy in front, which is the
      # case here: Cloudflare is DNS-only for api.njakasoa.xyz and never touches
      # the request. Raise to 2 only if its proxy is switched on — it would then
      # append to this same header. Defaulted to 1 and not to an empty string, per
      # the note above: zod rejects "" for a positive integer, so the API would
      # refuse to boot.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Stored objects get their own bucket: opening one book of the bibliothèque
      # asks for up to 166 thumbnails at once, and on the shared 120/min counter
      # that both cuts the grid off mid-load and locks the visitor out of every
      # other endpoint until the window rolls. Any future gallery has the same
      # shape, which is why the bucket is on /v1/objets/ and not on one feature.
      # Still a limit and not an exemption — the route is unauthenticated and
      # reads a whole bytea row (or a round trip to R2) per request.
      RATE_LIMIT_IMAGES_MAX: ${RATE_LIMIT_IMAGES_MAX:-300}
      # Objets stockés — toutes fonctionnalités : `db` (bytea) ou `r2`. Ne dit
      # que la destination des NOUVEAUX octets ; chaque ligne d'`objets` porte le
      # sien, et c'est lui que la lecture consulte, pour qu'une base à moitié
      # migrée reste servable. Défaut explicite plutôt que chaîne vide : zod
      # rejette "" pour une énumération, et l'API refuserait de démarrer.
      OBJETS_STOCKAGE: ${OBJETS_STOCKAGE:-db}
      # Requis dès que OBJETS_STOCKAGE=r2 ; l'API refuse alors de démarrer sans
      # eux. Le seau n'est PAS public : le vote des gardiens que fait
      # GET /v1/objets/:sha256 n'a pas d'équivalent côté Cloudflare.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3000/readyz');if(!r.ok)process.exit(1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks:
      - default
      - proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  pgdata:

networks:
  proxy:
    external: true
